<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban Board — drag, drop, done</title>
  <meta name="description" content="A fast, offline kanban board with drag and drop, tags, due dates, search and dark mode. Data stays in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310b981'/%3E%3Crect x='12' y='14' width='11' height='36' rx='3' fill='white'/%3E%3Crect x='27' y='14' width='11' height='24' rx='3' fill='white'/%3E%3Crect x='42' y='14' width='11' height='14' rx='3' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="currentColor"/><rect x="12" y="14" width="11" height="36" rx="3" fill="#fff"/><rect x="27" y="14" width="11" height="24" rx="3" fill="#fff"/><rect x="42" y="14" width="11" height="14" rx="3" fill="#fff"/></svg>
      <h1>Kanban</h1>
    </div>
    <div class="tools">
      <label class="search">
        <span class="sr-only">Search cards</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="Search…  ( / )">
      </label>
      <div class="filters" id="filters" role="group" aria-label="Filter by tag"></div>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle light / dark theme">◐</button>
      <button class="icon-btn" id="reset" type="button" aria-label="Reset demo board" title="Reset demo board">↺</button>
    </div>
  </header>

  <main class="board" id="board" aria-label="Board"></main>

  <p class="hint">Drag cards between columns · Double-click a card to edit · Press <kbd>N</kbd> for a new card · Built by <a href="https://moonwave-studio.com" target="_blank" rel="noopener">MoonWave</a></p>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="card-form">
      <h2 id="dialog-title">Edit card</h2>
      <label>Title<input name="title" required maxlength="120"></label>
      <label>Description<textarea name="desc" rows="3" maxlength="600"></textarea></label>
      <div class="row">
        <label>Tag
          <select name="tag">
            <option value="">None</option>
            <option value="design">Design</option>
            <option value="dev">Dev</option>
            <option value="bug">Bug</option>
            <option value="client">Client</option>
          </select>
        </label>
        <label>Due date<input type="date" name="due"></label>
      </div>
      <label>Column<select name="column" id="column-select"></select></label>
      <div class="dialog-actions">
        <button type="button" class="btn btn--danger" id="delete">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn--ghost" value="cancel" id="cancel">Cancel</button>
        <button type="submit" class="btn" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
